server:
  port: 20020
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: recall-system
  profiles:
    active: dev
  jackson:
    # 时间序列化：LocalDateTime 输出 ISO-8601，前端按需转本地时区（PRD 4.4）
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.recall.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除以实体上的 @TableLogic 注解为准（deletedAt 字段，null=未删，删除时置 NOW()）

# 业务自定义配置
recall:
  jwt:
    # HMAC-SHA 密钥，生产环境务必更换（至少 32 字节）
    secret: recall-platform-jwt-secret-please-change-in-production-0123456789
    # 过期时间 7 天（毫秒）
    expiration-millis: 604800000
  oa:
    # OA 密码加密密钥（AES-GCM 口令，生产环境务必更换）
    crypto-key: recall-platform-oa-crypto-key-please-change-0123456789
    # 是否无头运行同步浏览器；联调排查时置 false 可观察浏览器操作过程
    debug-headless: true
    attendance:
      # 每日考勤抓取 cron（Asia/Shanghai）：抓前一天 + 近7天缺失补抓
      cron: 0 0 8 * * ?
  daily:
    # 日报禁用词（公司合规要求，逗号分隔；保存兜底校验与前端实时提示共用，改后需重启）
    forbidden-words: 面谈,改造,优化,迭代,面试,培训,学习,PPT,新人,升级,答辩,晋升,晋级,竞赛,课程,技术交流,试点,工作交接,Deepseek
  minutes:
    # 会议纪要推送鉴权 Token（推送方请求头 X-Push-Token）
    push-token: mm_2f8a4c6e9d1b735a
    # 推送归属用户 ID（个人平台，推送统一挂该用户名下）
    owner-user-id: 140
  llm:
    # 绩效面谈大模型网关（Anthropic 协议，POST {base-url}/v1/messages）
    base-url: http://192.168.3.77:13000
    api-key: sk-LtvaZt3bwOxe11jw7j8ICvNSQJIzvVxDu5502ZoYa34zQdHA
    model: deepseek-flash
    # 单次调用读超时（秒）
    timeout-seconds: 60
  jev:
    # jev 模型（TypeSafe System One 结构化问答）开关：false 时不装配客户端，平台走上方 LLM 网关
    enabled: true
    api-key: sk-zk2ca6fe0e936683cf43ff15b3d8c51e1a46ab4c29e56722
    base-url: https://api.zhizengzeng.com
    model: jev-latest
    # 单次 HTTP 操作超时（秒）
    timeout-seconds: 10
    # 重试次数与单次调用总预算（秒）
    max-retries: 2
    retry-budget-seconds: 30

logging:
  level:
    com.recall: debug
    org.springframework.security: info

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.recall.controller
